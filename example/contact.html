</nav></header><main id="main"><h1>Contact Alex</h1>
<p>Practice form: use made-up details. Nothing will be sent or stored.</p>
<form id="contact-form">
  <label for="name">Name</label>
  <input id="name" name="name" type="text" required>

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>

  <label for="subject">Subject</label>
  <select id="subject" name="subject" required>
    <option value="">Choose a subject…</option>
    <option value="booking">Booking</option>
    <option value="press">Press</option>
    <option value="fan">Fan message</option>
  </select>

  <label for="message">Message</label>
  <textarea id="message" name="message"
            rows="5" minlength="10" required></textarea>

  <button type="submit">Send message</button>
  <p id="form-result" role="status"></p>
</form></main><footer><p>Fictional practice website. No orders or messages are processed.</p><p><a href="../project_tutorial.html">Return to the tutorials</a></p></footer></body></html>
